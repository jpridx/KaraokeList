name: Deploy Azure

on:
  # Weekly batch CD — Sundays 12:00 UTC. Merges to master run CI only (ci.yml).
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy API, WASM, or both'
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - wasm
      apply_sqlite_connection:
        description: >-
          Opt in to set ConnectionStrings__DefaultConnection to SQLite (/home/data/karaokelist.db).
          Upload a populated DB first. After cutover, weekly deploys keep SQLite if already configured.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-karaokelist
  AZURE_BASE_NAME: karaokelist
  DOTNET_VERSION: '10.0.x'
  KARAOKE_TEST_SQL_CONNECTION: Data Source=KaraokeList_IntegrationTest.db
  KARAOKE_INTEGRATION_TESTS_REQUIRED: "true"
  # Public WASM URL (Cloudflare custom domain). Used for CORS and smoke tests.
  WASM_PUBLIC_ORIGIN: https://karaoke.johnprideaux.net

jobs:
  # ── Build + test gate ────────────────────────────────────────────────────────
  # Runs unconditionally — never skip tests before a deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build
        env:
          SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_KEY }}
        run: |
          dotnet restore KaraokeList.sln
          dotnet build KaraokeList.sln -c Release --no-restore /p:SyncfusionKey="$SYNCFUSION_KEY"

      - name: Unit tests (API)
        run: dotnet test KaraokeList.Api.Tests/KaraokeList.Api.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Unit tests (Web)
        run: dotnet test KaraokeList.Web.Tests/KaraokeList.Web.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Integration tests (API)
        run: dotnet test KaraokeList.Api.IntegrationTests/KaraokeList.Api.IntegrationTests.csproj -c Release --no-build --verbosity minimal

  # ── Deploy API ───────────────────────────────────────────────────────────────
  # Runs on weekly schedule (both) or manual dispatch when deploy_target is api/both.
  deploy-api:
    needs: [test]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'api'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Federated credential subject must include environment:production
      # (see scripts/setup-github-oidc.ps1).
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resource names
        id: azure
        run: |
          API_APP_NAME="api-${AZURE_BASE_NAME}"
          API_BASE_URL="https://${API_APP_NAME}.azurewebsites.net"
          echo "api_app_name=${API_APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${API_BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Enable App Service persistent storage (SQLite)
        run: |
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --settings WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
            --output none

      - name: Apply or keep SQLite connection string
        env:
          APPLY_SQLITE_CONNECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_sqlite_connection == true }}
        run: |
          set -euo pipefail
          SQLITE_CS='Data Source=/home/data/karaokelist.db'
          CURRENT=$(az webapp config appsettings list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" -o tsv)
          CURRENT="${CURRENT:-}"

          already_sqlite=false
          if [[ "$CURRENT" == *"karaokelist.db"* ]]; then
            already_sqlite=true
          elif [[ "$CURRENT" == *"Data Source="* ]] \
            && [[ "$CURRENT" != *"Server="* ]] \
            && [[ "$CURRENT" != *".database.windows.net"* ]]; then
            already_sqlite=true
          fi

          if [[ "${APPLY_SQLITE_CONNECTION}" == "true" ]]; then
            echo "apply_sqlite_connection=true — setting SQLite connection string (upload /home/data/karaokelist.db first)."
          elif [[ "$already_sqlite" == "true" ]]; then
            echo "App Service already uses SQLite — refreshing connection string."
          else
            echo "::warning::Skipping SQLite connection cutover (current DefaultConnection is not SQLite)."
            echo "Upload a populated /home/data/karaokelist.db, then re-run Deploy Azure with apply_sqlite_connection=true."
            echo "Current: ${CURRENT:-<unset>}"
            exit 0
          fi

          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --settings "ConnectionStrings__DefaultConnection=${SQLITE_CS}" \
            --output none
          echo "API uses SQLite at /home/data/karaokelist.db (EF MigrateAsync on startup)."

      - name: Publish API
        run: |
          dotnet publish KaraokeList.Api/KaraokeList.Api.csproj \
            -c Release \
            -o ./publish/api \
            /p:SourceRevisionId=${{ github.sha }}

      - name: Configure API startup
        run: |
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none
          az webapp config set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --startup-file "dotnet KaraokeList.Api.dll"

      - name: Package API for Linux App Service
        run: |
          cd ./publish/api
          zip -r ../karaokelist-api.zip .

      - name: Deploy API (zip)
        run: |
          # --track-status false: Azure CLI 2.61+ polls until "site started" (~5 min cap).
          # Migrations run before publish; startup MigrateAsync() is a dev/fresh-DB safety net.
          az webapp deploy \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --src-path ./publish/karaokelist-api.zip \
            --type zip \
            --async true \
            --track-status false \
            --clean true \
            --restart true \
            --timeout 300
          echo "API linuxFxVersion: $(az webapp config show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --query linuxFxVersion -o tsv)"

      - name: Sync API CORS with public WASM origin
        run: |
          WASM_ORIGIN="${WASM_PUBLIC_ORIGIN%/}"
          az webapp config appsettings set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}" \
            --settings "Cors__Origins__0=${WASM_ORIGIN}" \
            --output none
          az webapp restart \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${{ steps.azure.outputs.api_app_name }}"
          echo "CORS set to ${WASM_ORIGIN} (API restarted)"

      - name: Smoke test API
        run: |
          API_URL="${{ steps.azure.outputs.api_base_url }}"
          echo "Waiting for API cold start (EF migrations on SQLite file can take a minute on first boot)..."
          for attempt in $(seq 1 40); do
            ME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "${API_URL}/api/auth/me" || echo "000")
            REG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "${API_URL}/api/auth/registration" || echo "000")
            if [ "$ME_STATUS" = "401" ] || [ "$REG_STATUS" = "200" ]; then
              VERSION_JSON=$(curl -s --max-time 60 "${API_URL}/api/version" || echo "{}")
              echo "Version: ${VERSION_JSON}"
              if echo "${VERSION_JSON}" | grep -q '"databaseAvailable":true'; then
                echo "API smoke test passed on attempt ${attempt} (me=${ME_STATUS}, registration=${REG_STATUS}, database available)."
                exit 0
              fi
              echo "API responded but databaseAvailable is not true — retrying..."
            fi
            ROOT_SNIPPET=$(curl -s --max-time 30 "${API_URL}/" | tr -d '\n' | head -c 120)
            echo "Attempt ${attempt}/40: me=${ME_STATUS}, registration=${REG_STATUS}"
            echo "Root snippet: ${ROOT_SNIPPET}"
            sleep 15
          done
          echo "API not healthy after ~10 minutes. Check: az webapp log startup show -n ${{ steps.azure.outputs.api_app_name }} -g ${AZURE_RESOURCE_GROUP}"
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "## API deployed"
            echo ""
            echo "| Resource | URL |"
            echo "|----------|-----|"
            echo "| API | ${{ steps.azure.outputs.api_base_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy WASM ──────────────────────────────────────────────────────────────
  # Runs on weekly schedule (both) or manual dispatch when deploy_target is wasm/both.
  deploy-wasm:
    needs: [test]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'wasm'))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resource names
        id: azure
        run: |
          API_APP_NAME="api-${AZURE_BASE_NAME}"
          STATIC_WEB_APP_NAME="stapp-${AZURE_BASE_NAME}"
          API_BASE_URL="https://${API_APP_NAME}.azurewebsites.net"
          echo "static_web_app_name=${STATIC_WEB_APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${API_BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Patch WASM ApiBaseUrl for publish
        env:
          API_BASE_URL: ${{ steps.azure.outputs.api_base_url }}
        run: |
          python3 <<'PY'
          import json, os
          path = "KaraokeList.Web/wwwroot/appsettings.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["ApiBaseUrl"] = os.environ["API_BASE_URL"].rstrip("/")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Publish WASM
        env:
          SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_KEY }}
        run: |
          dotnet publish KaraokeList.Web/KaraokeList.Web.csproj \
            -c Release \
            -o ./publish/web \
            /p:SyncfusionKey="${SYNCFUSION_KEY}" \
            /p:SourceRevisionId=${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Static Web Apps CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Deploy WASM to Static Web Apps
        run: |
          SWA_TOKEN=$(az staticwebapp secrets list \
            --name "${{ steps.azure.outputs.static_web_app_name }}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.apiKey" -o tsv)
          swa deploy ./publish/web/wwwroot \
            --deployment-token "${SWA_TOKEN}" \
            --env production

      - name: Smoke test WASM
        run: |
          WASM_URL="${WASM_PUBLIC_ORIGIN%/}"
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WASM_URL}/")
            if [ "$STATUS" = "200" ]; then
              echo "WASM smoke test passed (200 on /)."
              exit 0
            fi
            echo "Attempt ${attempt}: expected 200, got ${STATUS} — waiting..."
            sleep 10
          done
          echo "WASM smoke test failed after retries."
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "## WASM deployed"
            echo ""
            echo "| Resource | URL |"
            echo "|----------|-----|"
            echo "| WASM | ${WASM_PUBLIC_ORIGIN%/} |"
            echo "| Register | ${WASM_PUBLIC_ORIGIN%/}/register?invite=YOUR_CODE |"
            echo ""
            echo "SQLite cutover: upload populated \`/home/data/karaokelist.db\` before \`apply_sqlite_connection\` — see docs/sqlite-production.md."
          } >> "$GITHUB_STEP_SUMMARY"
