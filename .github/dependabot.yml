version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "deps"

    groups:
      microsoft-dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"

      azure:
        patterns:
          - "Azure.*"

      other:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
          - "Azure.*"
          - "Syncfusion.*"

      # Keep Grid and DropDowns on the same 34.x build.
      syncfusion:
        patterns:
          - "Syncfusion.*"

    # License covers any Syncfusion 34.x.x release (patch and minor).
    # Major upgrades (35+) need a new key; do those by hand.
    # The CDN theme URL is stamped at build from the package version (not edited here).
    ignore:
      - dependency-name: "Syncfusion.*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      github-actions:
        patterns:
          - "*"
